name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Same-origin site URL so canonical/hreflang audits pass against the local server.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E (Playwright)
        run: npx playwright test
      - name: Lighthouse budgets
        run: node scripts/lighthouse.mts
        env:
          LH_URLS: "/,/work,/work/compass-pos,/services,/about,/contact"
          LH_RUNS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7
